---
## HOW server config (example).
## The server is a transparent catch-all reverse proxy: every path except
## /register and /status is forwarded to a HOW client, which routes it to a
## configured upstream. All headers (Authorization, etc.) pass through.

host : 127.0.0.1            # bind address
port : 8080                 # bind port
timeout : 1000              # ms to wait before acquiring a WS connection to forward a request
idletimeout : 60000         # ms before closing excess idle connections
livenesstimeout : 120000    # ms: an idle conn that received no frame (ping/pong/data) for this long is closed as half-open
secretkey : ThisIsASecret   # must match the client's secretkey

# --- Optional security (leave empty / commented to disable) ---

# Bound domains: only requests whose Host hostname is in this list are
# accepted; IP and unlisted hosts -> 403. Prevents bypassing the domain via IP.
# Leave empty to allow any host.
#allowedhosts :
# - your-domain.example.com
# - api.example.com

# Source IP whitelist: only requests from these IPs are served; any other
# source IP -> 403 "DENY <ip>". Leave empty to allow any source IP.
#allowips :
# - 192.168.1.100
# - 203.0.113.50

# API key whitelist: every proxied request must carry an
# Authorization: Bearer <key> header whose key is in this list; missing or
# non-matching -> 403. Prevents scanners from forwarding to the backend.
# Leave empty to disable the check.
#apikeys :
# - sk-your-api-key-1
# - sk-your-api-key-2
