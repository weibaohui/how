[package]
name = "how"
version = "0.3.0"
edition = "2021"
description = "HOW — transparent reverse HTTP proxy over WebSockets"
license = "MIT"

[lib]
name = "how"
path = "src/lib.rs"

[[bin]]
name = "how-server"
path = "src/bin/how-server.rs"

[[bin]]
name = "how-client"
path = "src/bin/how-client.rs"

[[bin]]
name = "how-test-api"
path = "src/bin/how-test-api.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal", "rt"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
tokio-tungstenite = "0.27"
tungstenite = "0.27"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio"] }
http = "1"
http-body = "1"
http-body-util = { version = "0.1", features = ["channel"] }
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
chrono = "0.4"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "blocking"] }
