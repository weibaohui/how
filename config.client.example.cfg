---
## HOW client config (example).
## The client dials OUT to the HOW server(s) and routes proxied requests to the
## configured upstream(s). The real destination lives here (in `routes`), NOT
## in the caller's request. All headers (Authorization, etc.) are forwarded
## transparently.

targets :                            # HOW servers to dial out to
 - ws://127.0.0.1:8080/register
poolidlesize : 10                    # tunnel TARGET per server (idle+busy both count). Demand-driven:
                                     # existing idle tunnels are always preferred — new ones are dialed only
                                     # to warm a cold pool up to this total, or +1 when every tunnel is busy.
                                     # Sizing: one in-flight request occupies one tunnel for its ENTIRE
                                     # lifetime — a long-lived stream (LLM SSE) holds it for the whole
                                     # response. Set this to your expected PEAK concurrency, not the
                                     # average. Field lesson: a pool of 4 serving 30–175s LLM streams plus
                                     # a polling app starved to "Unable to get a proxy connection" under
                                     # ordinary bursts.
poolmaxsize : 100                    # max concurrent WS connections per server — the hard cap for the
                                     # demand-driven +1/tick expansion under sustained overload.
secretkey : ThisIsASecret          # must match the server's secretkey

# Log output level: error | warn | info | debug (default info).
#  - error : only failures (dial failures, broken upstream streams, panics)
#  - warn  : + abnormal-but-handled conditions (dead/wedged/stuck tunnels
#            reaped by the health round, dial backoff, upstream timeouts,
#            ambient-proxy warning, config values clamped to a floor)
#  - info  : + startup (proxy mode, per-route decisions), tunnel
#            connect/close lifecycle, per-request upstream results,
#            pool health summaries
#  - debug : + per-request route resolution and pool size changes
# Unset/empty = info; an invalid value falls back to info with a warning.
loglevel : info

# Wedge backstop (ms). Normal dead-link detection is the ACTIVE health round
# below (probe ping -> pong within its own 10s deadline). This value covers
# the two cases a probe cannot test directly:
#  - a tunnel whose write queue is too full to even enqueue the probe ping
#    AND that has received no frame at all for longer than this — a live
#    driver drains the queue within ~RTT, so a permanently-full queue plus
#    a silent link is a wedged tunnel, closed as dead;
#  - a RUNNING tunnel that has BOTH received nothing AND sent nothing for
#    longer than this (clamped up to a 60s floor: a healthy running tunnel
#    waiting for upstream first bytes only sends at the 30s ping cadence,
#    so a lower threshold would false-reap it). A healthy running tunnel
#    always makes progress in at least one direction; both stale = the
#    driver is wedged on a half-open link mid-request.
# Default 90000. Any positive value is used as-is (the old "must exceed 2x
# the 30s ping interval" floor belonged to the removed passive reaper, not
# to this backstop) — with one caveat: the first bullet keeps the old
# floor's false-positive mode. Right after a long streamed response the
# write queue can still be draining (momentarily full, so not probeable)
# while the last pong is already old; a value below ~2x the 30s ping
# cadence (<60000ms) can read that healthy tunnel as "wedged" and close it.
# The default (3 cadences) makes the window negligible.
# 0 falls back to the default.
livenesstimeout : 90000

# Pool health-check interval (ms): every interval the client runs a health
# round — actively probe each idle tunnel (ping, wait up to 10s for the pong),
# log every tunnel's status ("pool health: idle=3 ok=3 ... |tunnel#1:ok(0s)"),
# close the tunnels that do not answer, and dial replacements so the pool is
# topped back up to poolidlesize VERIFIED tunnels. The round also reaps
# wedged RUNNING tunnels (see livenesstimeout above) and CONNECTING tunnels
# stuck past their budget (3x tunneltimeout + 10s, or 60s when unset). This round
# IS the client-side dead-link detector: while a half-open tunnel still
# LOOKS idle the demand-driven connector dials nothing, and only this round
# verifies liveness end to end (it replaced the old passive reaper —
# livenesstimeout above survives only as the wedge backstop). If the pool is
# completely empty and the connector is in dial backoff (up to 60s after
# consecutive failures), each round still dials one rescue tunnel at this
# cadence, so recovery does not wait out the backoff. Must exceed the 10s
# probe deadline; below the floor it falls back to the default and logs a
# warning. 0 also falls back.
healthcheckinterval : 30000

# --- Timeouts (explicit-only: a key left out or set to 0 applies NOTHING;
# --- there are no hidden defaults — only what you configure takes effect) ---
#
# The three ENABLED values below are the recommended baseline for LLM /
# long-lived streaming upstreams (pair them with the server's matching
# `upstreamtimeout`): an upstream that hangs BEFORE sending response headers
# otherwise occupies its tunnel forever — the client's 30s keepalive pings
# keep the link looking fresh, so no liveness fuse on either end ever fires,
# and enough hung requests wedge the whole pool at "0 idle, N busy" until a
# restart. With these set, a hung upstream costs one request (a fast 527 back
# to the caller), never the tunnel.

# Upstream dial timeout (ms): bounds DNS+TCP+TLS when connecting a route's
# upstream (caps blackholed-address stalls). 0/unset = no limit.
connecttimeout : 5000

# Upstream call deadline (ms): from sending the request to the upstream
# until its response HEADERS arrive. The body streams unbounded after the
# headers — a flowing SSE stream is never cut. 0/unset = no limit.
# Recommended for LLM upstreams: set it ABOVE your worst observed
# time-to-first-header (slow/reasoning models can take minutes — leave
# headroom), and at or below the server's `upstreamtimeout`, so the caller
# gets a descriptive 527 from this side before the server cuts the tunnel.
upstreamtimeout : 240000

# Tunnel establishment deadline (ms): bounds each phase of dialing the HOW
# server (TCP / WebSocket handshake / greeting). 0/unset = no per-phase
# limit — but even then a Connecting tunnel older than 60s is reaped by the
# health round (with a configured value the budget is 3x + 10s), so a peer
# that accepts TCP and goes silent can never leak pool capacity forever.
#tunneltimeout : 10000

# Upstream stream idle timeout (ms): per-read stall detection — a response
# that stops arriving for this long is treated as dead; one that keeps
# flowing is never cut, however long. 0/unset = no limit.
# Recommended for SSE: catches a stream that hangs MID-BODY (headers
# arrived, then silence) — the one phase upstreamtimeout cannot reach.
streamidletimeout : 60000

# Upstream keep-alive pool idle timeout (ms): pooled upstream connections
# unused for this long are closed. 0/unset = kept forever.
#upstreamidletimeout : 90000

# Route map: arrival host (the Host the caller targets on the server) -> upstream base URL.
# The client appends the request path to the upstream base. Only arrival hosts
# listed here are forwarded; any other host or IP -> 527 "No route".
routes :
 "127.0.0.1:8080" : "http://internal-api.local"
 "llm.example.com" : "https://api.openai.com/v1"

# ---------------------------------------------------------------------------
# Outbound proxy — which routes go through a proxy and which connect direct.
# ---------------------------------------------------------------------------
# Without this setting reqwest silently follows the ambient http_proxy /
# https_proxy / all_proxy variables — INCLUDING the uppercase HTTP_PROXY
# form that curl ignores — which is the classic "curl is fast on this box
# but the client program is slow" trap. Configure it explicitly instead:
#
#   proxy : <unset>          follow the env variables (backwards compatible;
#                            a loud WARNING is logged when any is set)
#   proxy : none             never use a proxy, ignore all env variables
#   proxy : http://h:p       use exactly this proxy, ignore all env variables
#
# Per-route control = global `proxy` + `noproxy` exceptions. Entries match
# the route's UPSTREAM address (the value in `routes`, NOT the arrival key):
# exact host ("api.corp"), host:port ("api.corp:8443"), or domain suffix
# ("*.corp" / ".corp" / "corp"). Every route's decision is printed at
# startup — the same logic that routes the requests, so the log never lies.
#
# Worked example — LLM traffic via proxy, intranet traffic direct:
#
#   proxy : http://127.0.0.1:7890
#   noproxy :
#    - "10.0.0.5"                # this exact upstream host, any port
#    - "127.0.0.1:9000"          # this upstream host AND port
#    - "*.corp.internal"         # every host under corp.internal
#   routes :
#    "llm.example.com"     : "https://api.openai.com/v1"   # -> VIA PROXY
#    "intranet.example.com": "http://10.0.0.5:9000"        # -> direct (noproxy)
#
# Startup log you should expect:
#
#   Outbound proxy mode: explicit http://127.0.0.1:7890
#     env: http_proxy=(unset) https_proxy=(unset) all_proxy=(unset) no_proxy=(unset)
#   route llm.example.com -> https://api.openai.com/v1 : VIA PROXY http://127.0.0.1:7890
#   route intranet.example.com -> http://10.0.0.5:9000 : direct (matches noproxy entry '10.0.0.5')
#
# proxy : none
# noproxy :
#  - "127.0.0.1"
#  - "*.corp.internal"
