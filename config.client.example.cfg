---
## HOW client config (example).
## The client dials OUT to the HOW server(s) and routes proxied requests to the
## configured upstream(s). The real destination lives here (in `routes`), NOT
## in the caller's request. All headers (Authorization, etc.) are forwarded
## transparently.

targets :                            # HOW servers to dial out to
 - ws://127.0.0.1:8080/register
poolidlesize : 10                    # idle WS connections to keep per server
poolmaxsize : 100                    # max concurrent WS connections per server
secretkey : ThisIsASecret          # must match the server's secretkey

# Liveness timeout (ms): an idle tunnel that has received no frame at all
# (pong/data) from the server for longer than this is half-open (the peer or
# the path is gone) and is closed so the pool connector dials a replacement.
# The client sends a ping every 30s, so on a live link a pong arrives ~every
# 30s. Default 90000 (90s = 3 ping periods) tolerates a couple of missed
# pongs while reaping dead links well before the server's `livenesstimeout`
# (default 120s), so the client reconnects proactively and the pool stays
# warm after an idle night. Sending pings without verifying pongs cannot
# detect dead links, so without this the client would hold a pool of dead
# connections and the server would report "no proxy available" the next
# morning. 0 falls back to the default.
livenesstimeout : 90000

# Route map: arrival host (the Host the caller targets on the server) -> upstream base URL.
# The client appends the request path to the upstream base. Only arrival hosts
# listed here are forwarded; any other host or IP -> 527 "No route".
routes :
 "127.0.0.1:8080" : "http://internal-api.local"
 "llm.example.com" : "https://api.openai.com/v1"