---
## HOW server config (example).
## The server is a transparent catch-all reverse proxy: every path except
## /register and /status is forwarded to a WSP client, which routes it to a
## configured upstream. All headers (Authorization, etc.) pass through.

host : 127.0.0.1            # bind address
port : 8080                 # bind port
timeout : 1000              # ms to wait before acquiring a WS connection to forward a request
idletimeout : 60000         # ms before closing excess idle connections
secretkey : ThisIsASecret   # must match the client's secretkey
