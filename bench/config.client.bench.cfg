---
# HOW benchmark client config — dials the bench server, routes the arrival
# host (127.0.0.1:18080) to the how-test-api upstream on :18081.
targets :
 - ws://127.0.0.1:18080/register
poolidlesize : 32        # idle WS connections kept warm
poolmaxsize : 128        # >= max benchmark concurrency (64)
secretkey : bench-secret
routes :
 "127.0.0.1:18080" : "http://127.0.0.1:18081"
